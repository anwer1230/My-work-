<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Telegram</title>
    <meta name="theme-color" content="#17212b" />
    <meta name="description" content="Official Telegram Web & Android App with MTProto Cloud Sync and Offline Support" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- iOS PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telegram" />
    <link rel="apple-touch-icon" href="/telegram-logo.svg" />

    <!-- Android PWA Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Telegram" />
    <link rel="icon" type="image/svg+xml" href="/telegram-logo.svg" />
    <link rel="shortcut icon" href="/telegram-logo.svg" />

    <script>
      window.__pwa_deferred = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwa_deferred = e;
        window.dispatchEvent(new CustomEvent('tg_pwa_install_ready', { detail: { promptEvent: e } }));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwa_deferred = null;
        window.dispatchEvent(new CustomEvent('tg_pwa_installed'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
